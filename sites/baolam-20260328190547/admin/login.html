<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Đăng nhập quản trị</title><style>body{font-family:Arial,sans-serif;background:#f5f6f8;margin:0;padding:32px;color:#222}.box{max-width:460px;margin:60px auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.08)}input{width:100%;padding:12px 14px;margin:10px 0;border:1px solid #ddd;border-radius:10px}button{width:100%;padding:13px 16px;background:#2E7D32;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer}.note{font-size:13px;color:#666}</style></head><body><div class="box"><h2>Đăng nhập quản trị</h2><p class="note">Website: BẢO LÂM</p><input id="user" placeholder="Tên đăng nhập" /><input id="pass" type="password" placeholder="Mật khẩu" /><button onclick="login()">Đăng nhập</button><p class="note" id="msg"></p></div><script>async function login(){const user=document.getElementById('user').value.trim();const pass=document.getElementById('pass').value.trim();const msg=document.getElementById('msg');msg.textContent='Đang kiểm tra...';const res=await fetch('https://n8n.omfarmbot.com/webhook/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user,pass,slug:'baolam-20260328190547'})});const data=await res.json();if(data.ok){localStorage.setItem('omfarm_admin_token',data.token);localStorage.setItem('omfarm_admin_slug',data.slug);window.location.href='./editor.html';}else{msg.textContent=data.message || 'Sai tài khoản hoặc mật khẩu';}}</script></body></html>
