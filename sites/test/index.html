<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Website doanh nghiệp</title><style>:root{--primary:#2E7D32;--accent:#F9A825;--overlay:rgba(0,0,0,0.45)}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#222;background:#f7f7f7}.hero{min-height:72vh;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(var(--overlay),var(--overlay)),#666 center/cover no-repeat;padding:64px 20px}.hero-inner{max-width:860px}.logo{max-width:120px;display:none;margin:0 auto 20px}h1{margin:0 0 16px;font-size:clamp(36px,6vw,64px)}.subtitle{font-size:clamp(18px,2vw,28px);margin-bottom:28px}.btn{display:inline-block;padding:14px 28px;background:var(--accent);color:#fff;text-decoration:none;border-radius:10px;font-weight:700}.section{max-width:1100px;margin:0 auto;padding:56px 20px}.section h2{color:var(--primary);margin-top:0}.contact-box{background:#fff;border-radius:14px;padding:24px;box-shadow:0 6px 22px rgba(0,0,0,0.08)}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}.gallery img{width:100%;border-radius:12px;display:block}footer{padding:30px 20px 60px;text-align:center;color:#777}</style></head><body><section class="hero" id="hero"><div class="hero-inner"><img id="logo" class="logo" alt="Logo" /><h1 id="hero_title"></h1><p id="hero_subtitle" class="subtitle"></p><a href="#contact" class="btn" id="cta_btn">Liên hệ ngay</a></div></section><section class="section"><h2 id="about_title"></h2><p id="about_text"></p></section><section class="section"><h2 id="product_title"></h2><p id="product_text"></p><div id="gallery" class="gallery"></div></section><section class="section" id="contact"><div class="contact-box"><h2>Liên hệ</h2><p id="cta_text"></p><p><strong>Điện thoại:</strong> <span id="phone"></span></p><p><strong>Email:</strong> <span id="email"></span></p></div></section><footer><small id="footer_company"></small></footer><script>fetch('./content/site.json').then(r=>r.json()).then(data=>{document.title=data.company_name || 'Website doanh nghiệp';document.documentElement.style.setProperty('--primary',data.primary_color || '#2E7D32');document.documentElement.style.setProperty('--accent',data.accent_color || '#F9A825');document.documentElement.style.setProperty('--overlay',data.hero_overlay || 'rgba(0,0,0,0.45)');if(data.hero_image){document.getElementById('hero').style.background='linear-gradient('+(data.hero_overlay || 'rgba(0,0,0,0.45)')+', '+(data.hero_overlay || 'rgba(0,0,0,0.45)')+'), url('+data.hero_image+') center/cover no-repeat';}if(data.logo){const logo=document.getElementById('logo');logo.src=data.logo;logo.style.display='block';}document.getElementById('hero_title').textContent=data.hero_title || data.company_name || '';document.getElementById('hero_subtitle').textContent=data.hero_subtitle || '';document.getElementById('about_title').textContent=data.about_title || 'Về chúng tôi';document.getElementById('about_text').textContent=data.about_text || '';document.getElementById('product_title').textContent=data.product_title || 'Sản phẩm / Dịch vụ';document.getElementById('product_text').textContent=data.product_text || '';document.getElementById('cta_text').textContent=data.cta_text || 'Liên hệ ngay với chúng tôi';document.getElementById('phone').textContent=data.phone || '';document.getElementById('email').textContent=data.email || '';document.getElementById('cta_btn').textContent=data.cta_text || 'Liên hệ ngay';document.getElementById('footer_company').textContent=data.company_name || '';const gallery=document.getElementById('gallery');(data.gallery || []).forEach(url=>{const img=document.createElement('img');img.src=url;img.loading='lazy';gallery.appendChild(img);});});</script></body></html>
